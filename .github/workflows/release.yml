name: release

# A tag starts a release: vX.Y.Z, vX.Y.Z-rc.N or nightly-YYYYMMDD. See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'
      - 'nightly-*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          python3 scripts/release/version.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/version.env"
          sed -e 's/^BHEEM_VERSION_NAME=/name=/' -e 's/^BHEEM_VERSION_CODE=/code=/' -e 's/^BHEEM_CHANNEL=/channel=/' "$RUNNER_TEMP/version.env" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The CHANGELOG has notes for this version
        if: steps.version.outputs.channel != 'nightly'
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: python3 scripts/release/changelog.py CHANGELOG.md "$VERSION" > /dev/null
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - name: Release scripts
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Checks
        run: |
          bash scripts/check-network-use.sh
          bash scripts/check-ui-strings.sh
      - name: Unit tests
        run: ./gradlew --no-daemon :models:test :agent-core:test :downloader:test :eval:test :storage:testDebugUnitTest
      - name: Every declared test ran
        run: python3 scripts/check-tests-ran.py
      - name: Quality gate on the golden outputs
        run: ./gradlew --no-daemon :eval:gate
      - name: Offline flavor has no INTERNET, full flavor has it
        run: ./gradlew --no-daemon :app:verifyManifests

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - copy: a
            tz: UTC
            lang: en_US.UTF-8
            cache_disabled: false
          - copy: b
            tz: Asia/Kolkata
            lang: C.UTF-8
            cache_disabled: true
    env:
      BHEEM_VERSION_NAME: ${{ needs.verify.outputs.name }}
      BHEEM_VERSION_CODE: ${{ needs.verify.outputs.code }}
      TZ: ${{ matrix.tz }}
      LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ matrix.cache_disabled }}
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build both flavors, unsigned
        run: ./gradlew --no-daemon --no-build-cache :app:assembleFullRelease :app:assembleOfflineRelease
      - name: The tree is still clean
        run: test -z "$(git status --porcelain)"
      - name: The APKs carry the version from the tag
        run: |
          set -euo pipefail
          for flavor in full offline; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk" | grep -q "versionCode='$BHEEM_VERSION_CODE' versionName='$BHEEM_VERSION_NAME'"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.copy }}
          path: |
            app/build/outputs/apk/full/release/*-unsigned.apk
            app/build/outputs/apk/offline/release/*-unsigned.apk
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17
      - name: Signing tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apks-a
          path: copy-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apks-b
          path: copy-b
      - name: Both builds are byte for byte the same
        run: |
          set -euo pipefail
          for flavor in full offline; do
            a="$(find copy-a -name "app-$flavor-release-unsigned.apk")"
            b="$(find copy-b -name "app-$flavor-release-unsigned.apk")"
            python3 scripts/release/compare_apks.py "$a" "$b"
          done
      - name: Sign and verify
        env:
          BHEEM_KEYSTORE_BASE64: ${{ secrets.BHEEM_KEYSTORE_BASE64 }}
          BHEEM_KEYSTORE_PASSWORD: ${{ secrets.BHEEM_KEYSTORE_PASSWORD }}
          BHEEM_KEY_ALIAS: ${{ secrets.BHEEM_KEY_ALIAS }}
          BHEEM_KEY_PASSWORD: ${{ secrets.BHEEM_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          test -s docs/release-cert.sha256
          expected="$(tr -d ' :\n' < docs/release-cert.sha256 | tr 'A-F' 'a-f')"
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$BHEEM_KEYSTORE_BASE64" | base64 -d > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for flavor in full offline; do
            unsigned="$(find copy-a -name "app-$flavor-release-unsigned.apk")"
            "$tools/zipalign" -c -P 16 4 "$unsigned"
            signed="$out/Bheem-$VERSION-$flavor.apk"
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$BHEEM_KEY_ALIAS" --ks-pass env:BHEEM_KEYSTORE_PASSWORD --key-pass env:BHEEM_KEY_PASSWORD --out "$signed" "$unsigned"
            "$tools/apksigner" verify --print-certs "$signed" > "$out/cert-$flavor.txt"
            "$tools/zipalign" -c -P 16 -v 4 "$signed" > /dev/null
            actual="$(grep -i 'certificate SHA-256 digest' "$out/cert-$flavor.txt" | head -1 | sed 's/.*: *//' | tr 'A-F' 'a-f')"
            test -n "$expected"
            test "$actual" = "$expected"
          done
          rm -f "$keystore"
      - name: Checksums and model hash
        env:
          VERSION: ${{ needs.verify.outputs.name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          (cd "$out" && sha256sum "Bheem-$VERSION-offline.apk" "Bheem-$VERSION-full.apk" > SHA256SUMS)
          python3 scripts/release/model_hashes.py app/src/main/assets/models.json > "$out/MODEL.txt"
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.name }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          notes="$RUNNER_TEMP/notes.md"
          if [ "$CHANNEL" = nightly ]; then
            echo "Nightly build of $GITHUB_SHA. Not for everyday use; it cannot update a release build." > "$notes"
          else
            python3 scripts/release/changelog.py CHANGELOG.md "$VERSION" > "$notes"
          fi
          {
            echo
            echo "SHA-256 of the APKs:"
            echo '```'
            cat "$out/SHA256SUMS"
            echo '```'
            echo "Signing certificate (compare with docs/release-cert.sha256 in the repository):"
            echo '```'
            grep -i "SHA-256 digest" "$out/cert-offline.txt" | head -1
            echo '```'
            echo "Model files these builds expect:"
            echo '```'
            cat "$out/MODEL.txt"
            echo '```'
          } >> "$notes"
          flag=""
          if [ "$CHANNEL" != release ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Bheem $VERSION" --notes-file "$notes" $flag \
            "$out/Bheem-$VERSION-offline.apk" "$out/Bheem-$VERSION-full.apk" "$out/SHA256SUMS" "$out/MODEL.txt"
          if [ "$CHANNEL" = nightly ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
